name: Brailio
options:
  bundleIdPrefix: com.brailio
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: XRUD95996R
targets:
  Brailio:
    type: application
    platform: iOS
    sources: [Brailio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brailio.app
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSCameraUsageDescription: Map approximate object positions using camera and motion tracking. No room video is saved.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Transcribe a conversation partner with their permission.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert spoken replies into text for tactile reading.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Find nearby destinations and provide foreground walking route cues.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Find nearby compatible Bluetooth tags by signal strength.
        INFOPLIST_KEY_CFBundleDisplayName: Brailio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  BrailioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BrailioTests]
    dependencies:
      - target: Brailio
  BrailioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BrailioUITests]
    dependencies:
      - target: Brailio
schemes:
  Brailio:
    build:
      targets:
        Brailio: all
    test:
      targets: [BrailioTests, BrailioUITests]
